# ~/.gnupg/gpg-agent.conf
#
# gpg-agent caches your passphrase in memory so you're not typing it
# on every single sign/decrypt. Two knobs control this:
#
#   default-cache-ttl  -> "idle" timer. Resets every time the key is
#                          used. Cache dies N seconds after the LAST use.
#   max-cache-ttl      -> "hard" timer. Cache dies N seconds after it
#                          was FIRST cached, no matter how often you use it.
#
# Only ONE of the three blocks below should be active at a time.
# Uncomment the pair you want, leave the other two commented out.

# == OPTION 1: 15 minutes
default-cache-ttl 900
max-cache-ttl 900

# == OPTION 2: 4 hours
# default-cache-ttl 14400
# max-cache-ttl 14400

# == OPTION 3: 24 hours
# default-cache-ttl 86400
# max-cache-ttl 86400

# ── Apply changes without restarting your session ───────────────
# gpg-agent reads this file at startup, so after editing it you need
# to kick the running agent to pick up the new values:
#
#   gpg-connect-agent reloadagent /bye
#
# "reloadagent" tells the running agent to re-read its config;
# "/bye" just closes the connect-agent session cleanly after.

# ── Confirm which agent/socket you're actually talking to ───────
# Useful if you have multiple GNUPGHOME dirs or something else
# (git, aws-cli via methuselah, etc.) seems to be hitting a
# different agent than your interactive shell:
#
#   gpgconf --list-dirs agent-socket
#
# Prints the exact socket path the current gpg/gpgconf believes is
# "the" agent socket — compare it against what git/aws are using.

# unified methuselah pinentry
pinentry-program $HOME/.local/bin/methuselah-gpg-wrapper
